<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>SkyScan - Weather App</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link rel="stylesheet" href="/style.css">

</head>

<body>
    <main class="container-fluid min-vh-100 d-flex justify-content-center align-items-center py-4">


        <!-- =====================================================
             WEATHER CARD
             Bootstrap:
             - card
             - shadow-lg
             - rounded-4
             ===================================================== -->

        <div id="weather-container" class="card shadow-lg border-0 rounded-4">
            <!--APP HEADER-->

            <div class="card-body p-4 p-md-5">
                <!-- Application name -->
                <div class="text-center mb-4">

                    <h1 class="fw-bold mb-1"> 🌤️ SkyScan</h1>

                    <p class="text-secondary mb-0"> Weather at your fingertips</p>
                      
                </div>

                <!-- SEARCH SECTION -->
                <div class="search-section mb-4">

                    <label for="city-input"  class="form-label fw-semibold">Search for a city</label>
   
                    <!-- Bootstrap input group -->
                    <div class="input-group">

                        <input type="text" id="city-input" class="form-control form-control-lg" placeholder="e.g. Kolkata" autocomplete="off">
                        
                        <button id="search-button" class="btn btn-primary px-4" type="button"> Search</button>                     

                    </div>

                </div>
                <!--LOCATION INFORMATION-->

                <div class="text-center mb-3">

                    <!-- City name will be inserted by JavaScript -->
                    <h2 id="city" class="fw-bold mb-1"></h2>

                    <!-- We will populate this later -->
                    <p id="date" class="text-secondary mb-0"></p>

                </div>

                <!--MAIN WEATHER INFORMATION-->

                <div class="text-center mb-4">

                    <!-- Weather image -->
                    <img id="weather-image" src="" alt="Weather condition" class="weather-icon mb-2" width="120" height="120">
    
                    <!-- Temperature -->
                    <div class="temperature-display">

                        <span id="temperature" class="display-3 fw-bold"></span>

                        <span class="temperature-unit">°C</span>
                                                 
                    </div>


                    <!-- Weather condition -->
                    <p id="weather-condition" class="fs-5 text-secondary mb-0"></p>
   
                </div>



                <!-- =========================================================
                  CURRENT WEATHER DETAILS
                  =========================================================

                  We use Bootstrap's responsive grid here.

                  col-6:
                  → 2 cards per row on small screens

                  col-md-4:
                  → 3 cards per row on medium/large screens

                  This gives us a nice responsive layout.
                  ========================================================= -->

              <div class="row g-3">

                  <!-- WIND SPEED -->

                  <div class="col-6 col-md-4">

                      <div class="weather-detail-card text-center">

                          <div class="weather-detail-icon">
                              💨
                          </div>

                          <p class="weather-detail-title">Wind Speed</p>

                          <p class="weather-detail-value"><span id="wind-speed">--</span>km/h</p>

                      </div>

                  </div>

                  <!-- HUMIDITY-->

                  <div class="col-6 col-md-4">

                      <div class="weather-detail-card text-center">

                          <div class="weather-detail-icon">
                              💧
                          </div>

                          <p class="weather-detail-title">Humidity</p>

                          <p class="weather-detail-value"><span id="humidity">--</span>%</p>

                      </div>

                  </div>

                  <!-- FEELS LIKE-->

                  <div class="col-6 col-md-4">

                      <div class="weather-detail-card text-center">

                          <div class="weather-detail-icon">
                              🌡️
                          </div>

                          <p class="weather-detail-title">Feels Like</p>

                          <p class="weather-detail-value"><span id="feels-like">--</span>°C</p>

                      </div>

                  </div>

                  <!-- WIND DIRECTION -->

                  <div class="col-6 col-md-4">

                      <div class="weather-detail-card text-center">

                          <div class="weather-detail-icon">
                              🧭
                          </div>

                          <p class="weather-detail-title">Wind Direction</p>

                          <p class="weather-detail-value"><span id="wind-direction">--</span><span id="wind-direction-degree">°</span></p>

                      </div>

                  </div>

                  <!-- PRECIPITATION -->

                  <div class="col-6 col-md-4">

                      <div class="weather-detail-card text-center">

                          <div class="weather-detail-icon">
                              🌧️
                          </div>

                          <p class="weather-detail-title">Precipitation</p>

                          <p class="weather-detail-value"><span id="precipitation">--</span>mm</p>

                      </div>

                  </div>

                  <!-- CLOUD COVER -->
                  <div class="col-6 col-md-4">

                      <div class="weather-detail-card text-center">

                          <div class="weather-detail-icon">
                              ☁️
                          </div>

                          <p class="weather-detail-title">Cloud Cover</p>

                          <p class="weather-detail-value"><span id="cloud-cover">--</span>%</p>

                      </div>

                  </div>

              </div>      <!-- Current weather details end here -->

                <!-- =================================================
                     LOADING MESSAGE

                     Initially hidden.

                     JavaScript will show this when we are
                     fetching weather data.
                     ================================================= -->

                <div id="loading" class="text-center mt-4 d-none">

                    <div class="spinner-border text-primary" role="status">
                     
                        <span class="visually-hidden"> Loading...</span>

                    </div>

                    <p class="text-secondary mt-2 mb-0">Getting weather data...</p>

                </div>

                <!-- =================================================
                     ERROR MESSAGE

                     Initially hidden.

                     JavaScript will display this when something
                     goes wrong.
                     ================================================= -->

                <div id="error-message" class="alert alert-danger text-center mt-4 d-none" role="alert"></div>

            </div>

        </div>

    </main>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwxHj09JcYn3nv7wiPVlz7YYjWJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"
    ></script>
    <script src="/script.js"></script>
</body>
</html>
